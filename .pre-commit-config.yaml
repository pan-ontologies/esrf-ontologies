repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-ontology-dashes
        name: Check ontology labels for non-ASCII dashes
        entry: python ontologies/check_dashes.py
        language: system
        pass_filenames: false
